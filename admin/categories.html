<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — MariaStore Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#FAF8F7', 100: '#F1EDEB', 200: '#E5DED9', 300: '#D5CCC8', 400: '#B8A8A3', 500: '#8B7671', 600: '#6B5B5A', 700: '#5A4D4C', 800: '#483E3D', 900: '#3A3230' },
                        dark: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px
        }

        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        .animate-slide-in {
            animation: slide-in .3s ease forwards
        }
    </style>
</head>

<body class="bg-dark-50 font-sans antialiased">

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 z-40 bg-dark-900/60 backdrop-blur-sm hidden lg:hidden"
        onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed top-0 left-0 z-50 h-full w-64 bg-dark-900 border-r border-dark-800 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
        <div class="flex items-center gap-3 px-6 h-16 border-b border-dark-800/60">
            <img src="../frontend/assets/logo.png" alt="MariaStore Logo" class="h-10 w-auto">
            <span class="text-lg font-extrabold text-white tracking-tight">maria<span
                    class="text-brand-400">store</span></span>
        </div>
        <nav class="flex-1 py-6 px-3 space-y-1 overflow-y-auto scrollbar-thin">
            <p class="px-3 text-[10px] font-bold text-dark-500 uppercase tracking-widest mb-3">Main</p>
            <a href="dashboard.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-dark-400 hover:text-white hover:bg-dark-800/60 transition-colors"><i
                    class="fas fa-chart-pie w-5 text-center text-xs"></i> Dashboard</a>
            <a href="products.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-dark-400 hover:text-white hover:bg-dark-800/60 transition-colors"><i
                    class="fas fa-box w-5 text-center text-xs"></i> Products</a>
            <a href="categories.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium bg-brand-500/10 text-brand-400 border border-brand-500/10"><i
                    class="fas fa-tags w-5 text-center text-xs"></i> Categories</a>
            <p class="px-3 text-[10px] font-bold text-dark-500 uppercase tracking-widest mb-3 mt-8">Quick Links</p>
            <a href="/" target="_blank"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-dark-400 hover:text-white hover:bg-dark-800/60 transition-colors"><i
                    class="fas fa-external-link-alt w-5 text-center text-xs"></i> View Store</a>
        </nav>
        <div class="p-4 border-t border-dark-800/60">
            <div class="flex items-center gap-3 px-2">
                <div class="w-9 h-9 bg-brand-600/20 rounded-full flex items-center justify-center"><i
                        class="fas fa-user text-brand-400 text-xs"></i></div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-white truncate" id="adminEmail">Admin</p>
                    <p class="text-xs text-dark-500">Administrator</p>
                </div>
                <button onclick="logout()"
                    class="p-2 rounded-lg text-dark-500 hover:text-red-400 hover:bg-dark-800 transition-colors"
                    title="Logout"><i class="fas fa-sign-out-alt text-sm"></i></button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="lg:ml-64 min-h-screen">
        <!-- Top Bar -->
        <header class="sticky top-0 z-30 bg-dark-50/80 backdrop-blur-lg border-b border-dark-200">
            <div class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()"
                        class="lg:hidden p-2 rounded-lg text-dark-600 hover:bg-dark-200 transition-colors"><i
                            class="fas fa-bars"></i></button>
                    <h1 class="text-lg font-bold text-dark-900">Categories</h1>
                </div>
                <button onclick="openCatModal()"
                    class="inline-flex items-center gap-2 px-4 py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold rounded-xl transition-colors shadow-sm">
                    <i class="fas fa-plus text-xs"></i> Add Category
                </button>
            </div>
        </header>

        <!-- Content -->
        <div class="p-4 sm:p-6 lg:p-8">
            <!-- Categories Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="categoriesGrid">
                <div class="animate-pulse bg-dark-200 rounded-2xl h-48"></div>
                <div class="animate-pulse bg-dark-200 rounded-2xl h-48"></div>
                <div class="animate-pulse bg-dark-200 rounded-2xl h-48"></div>
            </div>

            <!-- Empty State -->
            <div class="hidden text-center py-20" id="emptyState">
                <div class="w-16 h-16 mx-auto mb-4 bg-dark-100 rounded-full flex items-center justify-center"><i
                        class="fas fa-tags text-dark-400 text-xl"></i></div>
                <h3 class="text-lg font-bold text-dark-800 mb-2">No categories yet</h3>
                <p class="text-sm text-dark-400 mb-6">Create your first category to organize products</p>
                <button onclick="openCatModal()"
                    class="inline-flex items-center gap-2 px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold rounded-xl transition-colors"><i
                        class="fas fa-plus text-xs"></i> Add Category</button>
            </div>
        </div>
    </main>

    <!-- Category Modal -->
    <div id="catModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-dark-900/60 backdrop-blur-sm" onclick="closeCatModal()"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
            <div class="border-b border-dark-200 px-6 py-4 flex items-center justify-between">
                <h2 id="catModalTitle" class="text-lg font-bold text-dark-900">Add Category</h2>
                <button onclick="closeCatModal()"
                    class="p-2 rounded-lg hover:bg-dark-100 text-dark-400 hover:text-dark-700 transition-colors"><i
                        class="fas fa-times"></i></button>
            </div>
            <form id="catForm" class="p-6 space-y-5" enctype="multipart/form-data">
                <input type="hidden" id="catId" value="">
                <div>
                    <label class="block text-sm font-medium text-dark-700 mb-2">Category Name *</label>
                    <input type="text" id="catName" required placeholder="e.g. T-Shirts"
                        class="w-full px-4 py-2.5 border border-dark-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-dark-700 mb-2">Image</label>
                    <div id="catExistingImage" class="mb-3"></div>
                    <label
                        class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-dark-300 rounded-xl cursor-pointer hover:border-brand-400 hover:bg-brand-50/30 transition-all">
                        <i class="fas fa-cloud-upload-alt text-xl text-dark-400 mb-1"></i>
                        <span class="text-sm text-dark-500">Upload image</span>
                        <input type="file" id="catImage" accept="image/*" class="hidden">
                    </label>
                    <div id="catImagePreview" class="mt-3"></div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeCatModal()"
                        class="flex-1 py-2.5 border border-dark-200 rounded-xl text-sm font-semibold text-dark-600 hover:bg-dark-50 transition-colors">Cancel</button>
                    <button type="submit" id="catSubmitBtn"
                        class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-semibold transition-colors shadow-sm">
                        <span id="catSubmitText">Create</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation -->
    <div id="deleteCatModal" class="fixed inset-0 z-[70] hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-dark-900/60 backdrop-blur-sm" onclick="closeDeleteCatModal()"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-6">
            <div class="w-14 h-14 mx-auto mb-4 bg-red-50 rounded-full flex items-center justify-center"><i
                    class="fas fa-trash-alt text-red-500 text-xl"></i></div>
            <h3 class="text-lg font-bold text-dark-900 text-center mb-2">Delete Category</h3>
            <p class="text-sm text-dark-500 text-center mb-6" id="deleteCatMsg">Are you sure you want to delete this
                category?</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteCatModal()"
                    class="flex-1 py-2.5 border border-dark-200 rounded-xl text-sm font-semibold text-dark-600 hover:bg-dark-50 transition-colors">Cancel</button>
                <button onclick="confirmDeleteCat()"
                    class="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-sm font-semibold transition-colors">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-[999] flex flex-col gap-3"></div>

    <script src="js/adminConfig.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/categories.js"></script>
</body>

</html>
