<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — MariaStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#FAF8F7', 100: '#F1EDEB', 200: '#E5DED9', 300: '#D5CCC8', 400: '#B8A8A3', 500: '#8B7671', 600: '#6B5B5A', 700: '#5A4D4C', 800: '#483E3D', 900: '#3A3230' },
                        dark: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html {
            scroll-behavior: smooth
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .animate-fade-up {
            animation: fade-up .5s ease forwards
        }

        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        .animate-slide-in {
            animation: slide-in .3s ease forwards
        }
    </style>
</head>

<body class="bg-dark-50 font-sans text-dark-800 antialiased">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b border-dark-200/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center gap-2 group">
                    <img src="/assets/logo.png" alt="MariaStore Logo"
                        class="h-8 sm:h-10 md:h-12 w-auto transition-transform group-hover:scale-105">
                    <span class="text-lg sm:text-xl font-extrabold tracking-tight text-dark-900">maria<span
                            class="text-brand-600">store</span></span>
                </a>
                <div class="flex items-center gap-3">
                    <a href="/"
                        class="text-sm font-medium text-dark-600 hover:text-brand-600 transition-colors hidden sm:inline">Home</a>
                    <a href="cart.html" class="relative p-2.5 rounded-full hover:bg-dark-100 transition-colors group">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-dark-700 group-hover:text-brand-600"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                        </svg>
                        <span id="cartBadge"
                            class="absolute -top-0.5 -right-0.5 bg-brand-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-lg"
                            style="display:none">0</span>
                    </a>
                    <a href="/admin" class="p-2.5 rounded-full hover:bg-dark-100 transition-colors group"
                        title="Admin Login">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-dark-700 group-hover:text-brand-600"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <nav class="flex items-center gap-2 text-sm text-dark-400">
            <a href="/" class="hover:text-brand-600 transition-colors">Home</a>
            <i class="fas fa-chevron-right text-[10px]"></i>
            <a href="/#products" class="hover:text-brand-600 transition-colors">Products</a>
            <i class="fas fa-chevron-right text-[10px]"></i>
            <span class="text-dark-700 font-medium" id="breadcrumbName">Loading...</span>
        </nav>
    </div>

    <!-- Product Detail -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16">

            <!-- Image Gallery -->
            <div>
                <!-- Main Image -->
                <div class="relative overflow-hidden rounded-2xl bg-dark-100 aspect-square mb-4 group cursor-zoom-in"
                    id="mainImageContainer">
                    <img id="mainImage" src="" alt="Product"
                        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                    <div class="absolute inset-0 bg-dark-900/5 opacity-0 group-hover:opacity-100 transition-opacity">
                    </div>
                    <!-- skeleton -->
                    <div id="imageSkeleton" class="absolute inset-0 bg-dark-200 animate-pulse"></div>
                </div>
                <!-- Thumbnails -->
                <div class="flex gap-3 overflow-x-auto scrollbar-hide" id="thumbnailsRow">
                </div>
            </div>

            <!-- Product Info -->
            <div class="flex flex-col">
                <!-- Loading skeleton -->
                <div id="infoSkeleton">
                    <div class="animate-pulse space-y-4">
                        <div class="h-5 bg-dark-200 rounded w-1/4"></div>
                        <div class="h-8 bg-dark-200 rounded w-3/4"></div>
                        <div class="h-6 bg-dark-200 rounded w-1/3"></div>
                        <div class="h-px bg-dark-200 my-6"></div>
                        <div class="h-4 bg-dark-200 rounded w-full"></div>
                        <div class="h-4 bg-dark-200 rounded w-5/6"></div>
                        <div class="h-4 bg-dark-200 rounded w-4/6"></div>
                    </div>
                </div>

                <div id="productInfo" class="hidden">
                    <!-- Category -->
                    <a href="#" id="productCategory"
                        class="inline-flex items-center gap-1.5 text-sm font-semibold text-brand-600 hover:text-brand-700 transition-colors mb-3">
                        <i class="fas fa-tag text-xs"></i>
                        <span></span>
                    </a>

                    <!-- Name -->
                    <h1 id="productName" class="text-3xl sm:text-4xl font-extrabold text-dark-900 tracking-tight mb-4">
                    </h1>

                    <!-- Price -->
                    <div class="flex items-baseline gap-3 mb-6">
                        <span id="productPrice" class="text-3xl font-bold text-dark-900"></span>
                        <span id="productComparePrice" class="text-lg text-dark-400 line-through hidden"></span>
                        <span id="productDiscount"
                            class="hidden text-sm font-bold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full"></span>
                    </div>

                    <div class="h-px bg-dark-200 mb-6"></div>

                    <!-- Description -->
                    <p id="productDescription" class="text-dark-500 leading-relaxed mb-8"></p>

                    <!-- Colors -->
                    <div id="colorsSection" class="hidden mb-6">
                        <h3 class="text-sm font-semibold text-dark-700 mb-3">Color: <span id="selectedColorName"
                                class="text-brand-600"></span></h3>
                        <div id="colorsGrid" class="flex flex-wrap gap-2"></div>
                    </div>

                    <!-- Sizes -->
                    <div id="sizesSection" class="hidden mb-8">
                        <h3 class="text-sm font-semibold text-dark-700 mb-3">Size</h3>
                        <div id="sizesGrid" class="flex flex-wrap gap-2"></div>
                    </div>

                    <!-- Quantity -->
                    <div class="mb-8">
                        <h3 class="text-sm font-semibold text-dark-700 mb-3">Quantity</h3>
                        <div class="inline-flex items-center border border-dark-200 rounded-xl overflow-hidden">
                            <button id="qtyMinus"
                                class="w-11 h-11 flex items-center justify-center text-dark-600 hover:bg-dark-100 transition-colors">
                                <i class="fas fa-minus text-xs"></i>
                            </button>
                            <span id="qtyValue" class="w-12 text-center font-semibold text-dark-800">1</span>
                            <button id="qtyPlus"
                                class="w-11 h-11 flex items-center justify-center text-dark-600 hover:bg-dark-100 transition-colors">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-col sm:flex-row gap-3">
                        <button id="addToCartBtn"
                            class="flex-1 inline-flex items-center justify-center gap-2 px-8 py-4 bg-dark-900 hover:bg-dark-800 text-white font-semibold rounded-full transition-all shadow-lg hover:-translate-y-0.5 active:translate-y-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                            </svg>
                            Add to Cart
                        </button>
                        <a id="buyNowBtn" href="#" target="_blank"
                            class="inline-flex items-center justify-center gap-2 px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-full transition-all shadow-lg hover:-translate-y-0.5 active:translate-y-0">
                            <i class="fab fa-whatsapp text-lg"></i>
                            Buy via WhatsApp
                        </a>
                    </div>

                    <!-- Product Meta -->
                    <div class="mt-8 p-5 bg-dark-50 border border-dark-200 rounded-2xl space-y-3">
                        <div class="flex items-center gap-3 text-sm">
                            <i class="fas fa-shield-check text-brand-500 w-5 text-center"></i>
                            <span class="text-dark-600">Secure checkout via WhatsApp</span>
                        </div>
                        <div class="flex items-center gap-3 text-sm">
                            <i class="fas fa-box text-brand-500 w-5 text-center"></i>
                            <span class="text-dark-600">Quality guaranteed</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Related Products -->
    <section class="py-16 bg-white" id="relatedSection">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-dark-900 mb-8">You May Also Like</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6" id="relatedGrid">
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark-900 text-dark-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <img src="/assets/logo.png" alt="MariaStore Logo" class="h-8 sm:h-10 w-auto">
                    <span class="text-base sm:text-lg font-extrabold text-white">maria<span
                            class="text-brand-400">store</span></span>
                </div>
                <p class="text-xs text-dark-500">&copy; 2026 MariaStore. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-[999] flex flex-col gap-3"></div>

    <script src="js/config.js?v=2"></script>
    <script src="js/cart.js?v=2"></script>
    <script src="js/product.js?v=2"></script>
</body>

</html>
