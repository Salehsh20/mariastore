<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders — MariaStore Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#FAF8F7', 100: '#F1EDEB', 200: '#E5DED9', 300: '#D5CCC8', 400: '#B8A8A3', 500: '#8B7671', 600: '#6B5B5A', 700: '#5A4D4C', 800: '#483E3D', 900: '#3A3230' },
                        dark: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .animate-fade-up {
            animation: fade-up .4s ease forwards
        }

        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        .animate-slide-in {
            animation: slide-in .3s ease forwards
        }
    </style>
</head>

<body class="bg-dark-50 font-sans antialiased">

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 z-40 bg-dark-900/60 backdrop-blur-sm hidden lg:hidden"
        onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed top-0 left-0 z-50 h-full w-64 bg-dark-900 border-r border-dark-800 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
        <!-- Logo -->
        <div class="flex items-center gap-3 px-6 h-16 border-b border-dark-800/60">
            <img src="/assets/logo.png" alt="MariaStore Logo" class="h-8 sm:h-10 w-auto">
            <span class="text-base sm:text-lg font-extrabold text-white tracking-tight">maria<span
                    class="text-brand-400">store</span></span>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 py-6 px-3 space-y-1 overflow-y-auto scrollbar-thin">
            <p class="px-3 text-[10px] font-bold text-dark-500 uppercase tracking-widest mb-3">Main</p>
            <a href="dashboard.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-dark-400 hover:text-white hover:bg-dark-800/60 transition-colors">
                <i class="fas fa-chart-pie w-5 text-center text-xs"></i> Dashboard
            </a>
            <a href="orders.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium bg-brand-500/10 text-brand-400 border border-brand-500/10">
                <i class="fas fa-shopping-bag w-5 text-center text-xs"></i> Orders
            </a>
            <a href="products.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-dark-400 hover:text-white hover:bg-dark-800/60 transition-colors">
                <i class="fas fa-box w-5 text-center text-xs"></i> Products
            </a>
            <a href="categories.html"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-dark-400 hover:text-white hover:bg-dark-800/60 transition-colors">
                <i class="fas fa-tags w-5 text-center text-xs"></i> Categories
            </a>

            <p class="px-3 text-[10px] font-bold text-dark-500 uppercase tracking-widest mb-3 mt-8">Quick Links</p>
            <a href="/" target="_blank"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-dark-400 hover:text-white hover:bg-dark-800/60 transition-colors">
                <i class="fas fa-external-link-alt w-5 text-center text-xs"></i> View Store
            </a>
        </nav>

        <!-- User Section -->
        <div class="p-4 border-t border-dark-800/60">
            <div class="flex items-center gap-3 px-2">
                <div class="w-9 h-9 bg-brand-600/20 rounded-full flex items-center justify-center">
                    <i class="fas fa-user text-brand-400 text-xs"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-white truncate" id="adminEmail">Admin</p>
                    <p class="text-xs text-dark-500">Administrator</p>
                </div>
                <button onclick="logout()"
                    class="p-2 rounded-lg text-dark-500 hover:text-red-400 hover:bg-dark-800 transition-colors"
                    title="Logout">
                    <i class="fas fa-sign-out-alt text-sm"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="lg:ml-64 min-h-screen">
        <!-- Top Bar -->
        <header class="sticky top-0 z-30 bg-dark-50/80 backdrop-blur-lg border-b border-dark-200">
            <div class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()"
                        class="lg:hidden p-2 rounded-lg text-dark-600 hover:bg-dark-200 transition-colors">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h1 class="text-lg font-bold text-dark-900">Orders</h1>
                        <p class="text-xs text-dark-500">Manage customer orders</p>
                    </div>
                </div>
                <!-- Status Filter -->
                <div class="flex items-center gap-3">
                    <select id="statusFilter"
                        class="text-sm border border-dark-200 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="all">All Orders</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="shipped">Shipped</option>
                        <option value="delivered">Delivered</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Orders Content -->
        <div class="p-4 sm:p-6 lg:p-8">
            <!-- Stats Row -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-xl border border-dark-200 p-4">
                    <p class="text-xs font-semibold text-dark-400 uppercase tracking-wide">Total Orders</p>
                    <p class="text-2xl font-extrabold text-dark-900 mt-1" id="statTotal">—</p>
                </div>
                <div class="bg-white rounded-xl border border-dark-200 p-4">
                    <p class="text-xs font-semibold text-amber-500 uppercase tracking-wide">Pending</p>
                    <p class="text-2xl font-extrabold text-dark-900 mt-1" id="statPending">—</p>
                </div>
                <div class="bg-white rounded-xl border border-dark-200 p-4">
                    <p class="text-xs font-semibold text-emerald-500 uppercase tracking-wide">Delivered</p>
                    <p class="text-2xl font-extrabold text-dark-900 mt-1" id="statDelivered">—</p>
                </div>
                <div class="bg-white rounded-xl border border-dark-200 p-4">
                    <p class="text-xs font-semibold text-red-500 uppercase tracking-wide">Cancelled</p>
                    <p class="text-2xl font-extrabold text-dark-900 mt-1" id="statCancelled">—</p>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="bg-white rounded-2xl border border-dark-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="bg-dark-50 border-b border-dark-200">
                                <th
                                    class="text-left py-3 px-4 text-xs font-semibold text-dark-400 uppercase tracking-wider">
                                    Order</th>
                                <th
                                    class="text-left py-3 px-4 text-xs font-semibold text-dark-400 uppercase tracking-wider">
                                    Customer</th>
                                <th
                                    class="text-left py-3 px-4 text-xs font-semibold text-dark-400 uppercase tracking-wider hidden md:table-cell">
                                    Phone</th>
                                <th
                                    class="text-left py-3 px-4 text-xs font-semibold text-dark-400 uppercase tracking-wider hidden lg:table-cell">
                                    Address</th>
                                <th
                                    class="text-left py-3 px-4 text-xs font-semibold text-dark-400 uppercase tracking-wider">
                                    Items</th>
                                <th
                                    class="text-left py-3 px-4 text-xs font-semibold text-dark-400 uppercase tracking-wider">
                                    Total</th>
                                <th
                                    class="text-left py-3 px-4 text-xs font-semibold text-dark-400 uppercase tracking-wider">
                                    Status</th>
                                <th
                                    class="text-left py-3 px-4 text-xs font-semibold text-dark-400 uppercase tracking-wider">
                                    Date</th>
                                <th
                                    class="text-left py-3 px-4 text-xs font-semibold text-dark-400 uppercase tracking-wider">
                                    Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <tr>
                                <td colspan="9" class="py-16 text-center text-dark-400">
                                    <i class="fas fa-spinner fa-spin mr-2"></i>Loading orders...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div class="flex items-center justify-between mt-6" id="paginationContainer" style="display:none">
                <p class="text-sm text-dark-500" id="paginationInfo"></p>
                <div class="flex gap-2" id="paginationButtons"></div>
            </div>
        </div>
    </main>

    <!-- Order Detail Modal -->
    <div id="orderModal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-dark-900/60 backdrop-blur-sm" onclick="closeOrderModal()"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-lg bg-white shadow-2xl overflow-y-auto">
            <div
                class="sticky top-0 bg-white border-b border-dark-200 px-6 py-4 flex items-center justify-between z-10">
                <h2 class="text-lg font-bold text-dark-900" id="modalTitle">Order Details</h2>
                <button onclick="closeOrderModal()"
                    class="p-2 rounded-lg text-dark-400 hover:text-dark-600 hover:bg-dark-100 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6" id="modalContent">
                <!-- Filled dynamically -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-[999] flex flex-col gap-3"></div>

    <script src="js/adminConfig.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orders.js"></script>
</body>

</html>
